<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treneroversikt CSK Herrer</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #ffffff; color: #000; }
    h1 { text-align: center; color: #fff; background-color: #d00000; padding: 10px; border-radius: 6px; }
    table { border-collapse: collapse; width: 100%; background: white; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    select { margin-bottom: 10px; padding: 6px; width: 100%; max-width: 300px; display: block; margin-left: auto; margin-right: auto; }
    .logo { display: block; margin: 0 auto 20px; max-width: 150px; }
    label { text-align: center; display: block; font-weight: bold; margin-top: 20px; }
    .export-button { display: block; margin: 20px auto; padding: 10px 20px; background-color: #d00000; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <img src="/mnt/data/CSK - Logo.png" alt="CSK Logo" class="logo">
  <h1>Treneroversikt CSK Herrer</h1>

  <label for="filterSpiller">Filtrer etter spiller:</label>
  <select id="filterSpiller">
    <option value="">Alle</option>
    <option>Tage Hestbek Nielsen</option>
    <option>Øyvind Varpe</option>
    <option>Elias Engesvik</option>
    <option>Helge Strømman</option>
    <option>Didrik Skjevik</option>
    <option>Erik Magnus Jakobsen</option>
    <option>Mathias Svendsen</option>
    <option>Fredrik Røset</option>
    <option>Simen Haugen</option>
    <option>Magnus Vatne</option>
    <option>Stein Holte Reppe</option>
    <option>Magnus Bjørnsen</option>
    <option>Simen Valsø Nicolaysen</option>
    <option>Stian Handberg Nielsen</option>
    <option>Magnus Johannessen</option>
    <option>Julius Hjelmungen</option>
    <option>Herman Schanke</option>
    <option>Sokrates Færø Ljøkelsøy</option>
    <option>Lukas Bjerkgård Lund</option>
    <option>Elias Aarsand</option>
    <option>Jesper Myrland Jensen</option>
    <option>Per Martin Almberg</option>
    <option>Bendik Dalen</option>
  </select>

  <button class="export-button" onclick="eksporterCSV()">Eksporter til CSV</button>

  <table>
    <thead>
      <tr>
        <th>Navn</th>
        <th>Dato</th>
        <th>Type</th>
        <th>Styrketype</th>
        <th>Varighet</th>
        <th>Intensitet</th>
        <th>Form</th>
        <th>Kommentar</th>
      </tr>
    </thead>
    <tbody id="loggInnhold"></tbody>
  </table>

  <script>
    const innhold = document.getElementById('loggInnhold');
    const filter = document.getElementById('filterSpiller');

    function hentOgVisLogg() {
      const data = JSON.parse(localStorage.getItem('treningslogg') || '[]');
      const valgtSpiller = filter.value;

      innhold.innerHTML = '';

      data.filter(entry => !valgtSpiller || entry.navn === valgtSpiller)
          .forEach(entry => {
            const rad = document.createElement('tr');
            const styrketype = entry.type === 'Styrke' ? entry.styrketype || '' : '';
            ['navn', 'dato', 'type'].forEach(felt => {
              const td = document.createElement('td');
              td.textContent = entry[felt];
              rad.appendChild(td);
            });
            const styrkeTd = document.createElement('td');
            styrkeTd.textContent = styrketype;
            rad.appendChild(styrkeTd);
            ['varighet', 'intensitet', 'form', 'kommentar'].forEach(felt => {
              const td = document.createElement('td');
              td.textContent = entry[felt];
              rad.appendChild(td);
            });
            innhold.appendChild(rad);
          });
    }

    function eksporterCSV() {
      const data = JSON.parse(localStorage.getItem('treningslogg') || '[]');
      let csv = 'Navn,Dato,Type,Styrketype,Varighet,Intensitet,Form,Kommentar\n';

      data.forEach(entry => {
        const styrketype = entry.type === 'Styrke' ? entry.styrketype || '' : '';
        const linje = [
          entry.navn,
          entry.dato,
          entry.type,
          styrketype,
          entry.varighet,
          entry.intensitet,
          entry.form,
          '"' + (entry.kommentar || '').replace(/"/g, '""') + '"'
        ].join(',');
        csv += linje + '\n';
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', 'treningslogg.csv');
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    filter.addEventListener('change', hentOgVisLogg);
    window.addEventListener('DOMContentLoaded', hentOgVisLogg);
  </script>
</body>
</html>
